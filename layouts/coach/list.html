{{ define "main" }}
<style>
.coach-wrap {
  --c-bg-card: #252729;
  --c-bg-input: #2a2d2f;
  --c-border: #3d4042;
  --c-text: #c9cacc;
  --c-text-muted: #777;
  --c-text-bright: #eaeaec;
  --c-accent: #e8b84b;
  --c-radius: 6px;
  /* No horizontal margin: see the matching comment in layouts/carbo/single.html
     — "margin: auto" on a flex item disables stretch and can pin it to a
     shrink-to-fit width narrower than the viewport on mobile. */
  max-width: 820px;
  width: 100%;
  padding: 0 0 3rem 0;
  font-family: inherit;
  color: var(--c-text);
}

.coach-intro h1.coach-title {
  font-size: 1.6rem;
  color: var(--c-accent);
  margin-bottom: 1rem;
  letter-spacing: 0.03em;
}
.coach-wrap > .coach-intro:first-child h1.coach-title {
  margin-top: 0;
}
.coach-bio {
  background: var(--c-bg-card);
  border: 1px solid var(--c-border);
  border-radius: var(--c-radius);
  padding: 1.2rem 1.4rem;
  margin-bottom: 2.4rem;
  line-height: 1.7;
}
.coach-bio p { margin: 0 0 1rem 0; }
.coach-bio p:last-child { margin-bottom: 0; }

.coach-photo {
  margin: 0 0 2.4rem 0;
}
.coach-photo img {
  display: block;
  width: 75%;
  height: auto;
  margin: 0 auto;
  border: 1px solid var(--c-border);
  border-radius: var(--c-radius);
}

.coach-clpv {
  display: flex;
  justify-content: center;
  margin: 0 0 2.4rem 0;
}
.coach-clpv iframe {
  max-width: 100%;
}

.coach-bmc {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-start;
  gap: 1rem;
  margin: 0 0 2.4rem 0;
}
.coach-bmc iframe {
  /* Narrower than the 480px default so it can sit next to the coffee
     button on one row within the page's ~700px content width, rather
     than always wrapping to its own row. */
  max-width: 380px;
  border-radius: var(--c-radius);
}

.coach-contact-sub {
  color: var(--c-text-muted);
  font-size: 0.85rem;
  margin: 0 0 1.2rem 0;
}

.coach-form {
  background: var(--c-bg-card);
  border: 1px solid var(--c-border);
  border-radius: var(--c-radius);
  padding: 1.2rem 1.4rem;
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
}
.coach-field { display: flex; flex-direction: column; }
.coach-field label {
  font-size: 0.68rem;
  color: var(--c-text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 0.3rem;
}
.coach-field input,
.coach-field textarea {
  background: var(--c-bg-input);
  border: 1px solid var(--c-border);
  border-radius: var(--c-radius);
  color: var(--c-text-bright);
  font-family: inherit;
  font-size: 0.9rem;
  padding: 0.55rem 0.7rem;
  resize: vertical;
  transition: border-color 0.15s;
}
.coach-field input:focus,
.coach-field textarea:focus {
  outline: none;
  border-color: var(--c-accent);
}

.coach-btn {
  align-self: flex-start;
  background: var(--c-accent);
  color: #1a1a1a;
  border: none;
  border-radius: var(--c-radius);
  font-size: 0.9rem;
  font-weight: 700;
  padding: 0.55rem 1.3rem;
  cursor: pointer;
  transition: opacity 0.15s;
}
.coach-btn:hover { opacity: 0.85; }
.coach-btn:disabled { opacity: 0.6; cursor: default; }

.coach-form-status {
  margin: 0.7rem 0 0 0;
  font-size: 0.85rem;
  min-height: 1.2em;
}
.coach-form-status.success { color: #2bbc8a; }
.coach-form-status.error { color: #d93025; }
</style>

<div class="coach-wrap">
  <section class="coach-intro">
    <h1 class="coach-title">{{ i18n "coach_about_heading" }}</h1>
    <div class="coach-bio">
      {{ .Params.about | markdownify }}
    </div>
  </section>

  <div class="coach-clpv">
    <iframe src="https://corsalentapensieriveloci.substack.com/embed?transparent=1&light=1" width="480" height="320" style="border: 0; background: transparent" frameborder="0" scrolling="no"></iframe>
  </div>

  <section class="coach-intro">
    <h1 class="coach-title">{{ i18n "coach_philosophy_heading" }}</h1>
    <div class="coach-bio">
      {{ .Params.philosophy | markdownify }}
    </div>
  </section>

  <figure class="coach-photo">
    <img src="{{ "images/coach/coaching-trail.jpg" | absURL }}" alt="Gabriele durante un allenamento trail running, in affiancamento a un atleta su uno sterrato tra i vigneti">
  </figure>

  <div class="coach-bmc">
    <script type="text/javascript" src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" data-name="bmc-button" data-slug="gabriele.orazi" data-color="#FFDD00" data-emoji="☕"  data-font="Inter" data-text="Buy me a coffee" data-outline-color="#000000" data-font-color="#000000" data-coffee-color="#ffffff" ></script>
  </div>

  <section class="coach-contact" id="contatti">
    <h1 class="coach-title">{{ i18n "coach_contact_heading" }}</h1>
    <p class="coach-contact-sub">{{ i18n "coach_contact_sub" }}</p>
    <form class="coach-form" id="coach-contact-form" action="https://formsubmit.co/gabtrailcoach@gmail.com" method="POST">
      <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
      <div class="coach-field">
        <label for="cf-name">{{ i18n "coach_form_name" }}</label>
        <input type="text" id="cf-name" name="name" required>
      </div>
      <div class="coach-field">
        <label for="cf-email">{{ i18n "coach_form_email" }}</label>
        <input type="email" id="cf-email" name="email" required>
      </div>
      <div class="coach-field">
        <label for="cf-message">{{ i18n "coach_form_message" }}</label>
        <textarea id="cf-message" name="message" rows="6" required></textarea>
      </div>
      <button type="submit" class="coach-btn" id="coach-submit-btn">{{ i18n "coach_form_submit" }}</button>
      <p class="coach-form-status" id="coach-form-status" role="status"></p>
    </form>
  </section>
</div>

<script>
(function () {
  var COACH_I18N = {
    sending: {{ i18n "coach_form_sending" | jsonify }},
    submit: {{ i18n "coach_form_submit" | jsonify }},
    success: {{ i18n "coach_form_success" | jsonify }},
    error: {{ i18n "coach_form_error" | jsonify }}
  };

  var form = document.getElementById('coach-contact-form');
  var btn = document.getElementById('coach-submit-btn');
  var status = document.getElementById('coach-form-status');
  var AJAX_ENDPOINT = 'https://formsubmit.co/ajax/gabtrailcoach@gmail.com';

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = COACH_I18N.sending;
    status.textContent = '';
    status.className = 'coach-form-status';

    fetch(AJAX_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('cf-name').value.trim(),
        email: document.getElementById('cf-email').value.trim(),
        message: document.getElementById('cf-message').value.trim(),
        _subject: 'Nuovo messaggio dal sito - Coaching',
        _template: 'table',
        _captcha: 'false'
      })
    })
      .then(function (res) {
        if (!res.ok) throw new Error('bad status');
        return res.json();
      })
      .then(function () {
        status.textContent = COACH_I18N.success;
        status.className = 'coach-form-status success';
        form.reset();
      })
      .catch(function () {
        status.textContent = COACH_I18N.error;
        status.className = 'coach-form-status error';
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = COACH_I18N.submit;
      });
  });
})();
</script>
{{ end }}
